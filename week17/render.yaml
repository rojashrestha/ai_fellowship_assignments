services:
  # -------------------------------------------------------------
  # Track A: Telco Churn Prediction API (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: telco-churn-api
    rootDir: week17/track_a
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health

  # -------------------------------------------------------------
  # Track B: Agentic AI Assistant Backend API (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: agentic-ai-backend
    rootDir: week17/track_b
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PRIMARY_PROVIDER
        value: gemini
      - key: FALLBACK_PROVIDER
        value: openai
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: 60
      - key: CACHE_ENABLED
        value: true

  # -------------------------------------------------------------
  # Track B: Interactive Web UI (Streamlit)
  # -------------------------------------------------------------
  - type: web
    name: agentic-ai-ui
    rootDir: week17/track_b
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: sh -c "streamlit run app/ui/streamlit_app.py --server.port ${PORT:-8501} --server.address 0.0.0.0"
    plan: free
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: agentic-ai-backend
          property: host
