[project]
name = "week17-track-b-agentic-mlops"
version = "0.1.0"
description = "Agentic AI MLOps track B project"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.6.1",
    "google-genai>=0.1.1",
    "openai>=1.14.0",
    "streamlit>=1.32.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "tiktoken>=0.6.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
    "mlflow>=2.12.0",
    "evidently>=0.4.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mlops", "evals"]
