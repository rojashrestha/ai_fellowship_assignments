[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "week17-track-a-mlops"
version = "0.1.0"
description = "Telco Customer Churn MLOps Project"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn",
    "mlflow",
    "evidently",
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "fastapi",
    "uvicorn",
    "xgboost",
    "kagglehub",
    "requests"
]
